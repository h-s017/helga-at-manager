name: Patch reminders safe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[loader-auto]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          set +e
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = ''.join(['<scr','ipt src="reminders-dropin.js?v=20260528"></scr','ipt>'])
          if tag not in s:
              s = s.replace('</body></html>', tag + '</body></html>') if '</body></html>' in s else s + tag
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit if changed
        run: |
          set +e
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load reminders drop-in [loader-auto]"
          git push
          exit 0
