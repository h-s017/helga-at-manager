name: Patch cat images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[cat-auto]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch pomodoro cat images
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          idle = 'data:image/webp;base64,'
          rest = 'data:image/webp;base64,'
          work = 'data:image/webp;base64,'

          if 'CAT_IMAGES=' not in s:
              s = s.replace("let pomoTimer=null", f"const CAT_IMAGES={{idle:'{idle}',rest:'{rest}',work:'{work}'}};let pomoTimer=null")
          s = s.replace('.pomo-cat{font-size:54px;margin:8px}', '.pomo-cat{display:flex;justify-content:center;align-items:center;margin:8px}.pomo-img{width:220px;max-width:76%;height:auto;object-fit:contain;display:block;margin:0 auto}')
          s = s.replace('<div class="pomo-cat" id="pomoCat">🐱</div>', '<div class="pomo-cat"><img id="pomoImg" class="pomo-img" alt="pomodoro cat"></div>')
          old = "function pomoRender(){if(!$('pomoTime'))return;const m=Math.floor(pomoRemain/60),s=pomoRemain%60;$('pomoTime').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');$('pomoMode').textContent=pomoMode==='work'?'專注中':'休息中';$('pomoCat').textContent=pomoMode==='work'?'🐱':'😺';$('pomoRounds').textContent=pomoRounds;$('pomoStartBtn').textContent=pomoRunning?'暫停':'開始'}"
          new = "function pomoRender(){if(!$('pomoTime'))return;const m=Math.floor(pomoRemain/60),sec=pomoRemain%60;$('pomoTime').textContent=String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');$('pomoMode').textContent=pomoRunning?(pomoMode==='work'?'專注中':'休息中'):'準備工作';const img=$('pomoImg');if(img)img.src=!pomoRunning?CAT_IMAGES.idle:(pomoMode==='work'?CAT_IMAGES.work:CAT_IMAGES.rest);$('pomoRounds').textContent=pomoRounds;$('pomoStartBtn').textContent=pomoRunning?'暫停':'開始'}"
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit cat image patch
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore pomodoro cat images [cat-auto]"
          git push