<style>
:root{--brand:#424A5A;--brand-rgb:66,74,90;--font:16px;--bg:#F4F1EB}*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:#2C2C2C;padding:16px;padding-bottom:96px;max-width:760px;margin:0 auto;font-size:var(--font)}header{background:var(--brand);color:white;padding:18px 20px;border-radius:12px;margin-bottom:14px}h1{font-size:18px}.sub{font-size:12px;opacity:.72;margin-top:4px}.top{display:flex;justify-content:space-between;gap:12px}.top button{margin-top:6px;background:rgba(255,255,255,.16);color:white;border:0;border-radius:6px;padding:6px 9px;font-size:11px}.tabs{display:flex;gap:6px;margin-bottom:14px;background:white;padding:4px;border-radius:10px}.tab{flex:1;text-align:center;padding:10px 4px;border-radius:7px;font-size:13px;cursor:pointer}.tab.active,.btn-primary,.fab button,.chip.active,.toast,.pomo-primary{background:var(--brand)!important;color:white}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}.stat{background:white;border-radius:8px;text-align:center;padding:10px 4px}.stat b{display:block;color:var(--brand);font-size:20px}.stat span{font-size:10px;color:#777}.card{background:white;border-radius:10px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.05)}.card-head{display:flex;justify-content:space-between;gap:10px}.name{font-weight:650;font-size:15px}.small{font-size:12px;color:#777;line-height:1.7;margin-top:4px}.note{font-size:12px;color:#555;background:#F8F6F1;padding:7px 8px;border-radius:7px;margin-top:8px}.status{font-size:11px;border-radius:12px;padding:3px 9px;white-space:nowrap;background:#E8F4F8;color:#2A6F86}.s-booked{background:#DFEEDA;color:#2C5F1F}.s-done{background:#E8E2F5;color:#5A3F8C}.s-log{background:#FAE0D5;color:#B0421A}.s-converted{background:#D4F0DD;color:#1B6B36}.s-lost{background:#eee;color:#777}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.btn{border:0;border-radius:7px;padding:8px 11px;font-size:12px;cursor:pointer;font-family:inherit}.btn-second{background:#EAE4D8;color:#555}.btn-call{background:#FF6B35;color:white}.btn-line{background:#06C755;color:white}.btn-cal{background:#4A86E8;color:white}.btn-del{background:transparent;color:#C44}.search{width:100%;padding:10px 13px;border:1px solid #DDD6C5;border-radius:8px;font-size:14px;margin-bottom:10px;background:white}.filters{display:flex;gap:6px;overflow:auto;margin-bottom:10px}.chip{background:white;border:1px solid #E5DDC8;border-radius:18px;padding:6px 11px;font-size:12px;white-space:nowrap;cursor:pointer}.empty{text-align:center;color:#999;padding:44px 10px;font-size:13px}.fab{position:fixed;left:16px;right:16px;bottom:22px;max-width:728px;margin:0 auto;pointer-events:none}.fab button{pointer-events:auto;width:100%;padding:15px;border:0;border-radius:12px;font-weight:650;font-size:15px;box-shadow:0 4px 16px rgba(var(--brand-rgb),.28)}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:50;overflow:auto;padding:20px 12px}.modal.show{display:block}.modal-box{background:white;border-radius:14px;padding:18px;max-width:620px;margin:0 auto}.modal-title{font-weight:650;color:var(--brand);margin-bottom:12px}.close{float:right;font-size:22px;color:#888;cursor:pointer}.form-group{margin-bottom:11px}.form-group label{display:block;font-size:12px;color:#555;margin-bottom:4px;font-weight:550}.form-group input,.form-group select,.form-group textarea{width:100%;padding:9px 10px;border:1px solid #DDD6C5;border-radius:7px;font-size:14px;font-family:inherit;background:white}.form-group textarea{min-height:64px;resize:vertical}.row{display:flex;gap:8px}.row .form-group{flex:1}.section-title{font-size:14px;font-weight:650;color:var(--brand);margin:12px 0 8px}.hint{font-size:12px;color:#888;line-height:1.6;margin:4px 0 10px}.toast{position:fixed;left:50%;bottom:102px;transform:translateX(-50%);padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;transition:.25s;z-index:99}.toast.show{opacity:1}.template{white-space:pre-wrap;background:white;border:1px solid #E5DDC8;border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.55;margin-bottom:8px;cursor:pointer}.template b{color:var(--brand)}.pomo{text-align:center;background:white;border-radius:12px;padding:22px;margin-bottom:12px}.pomo-time{font-size:48px;font-weight:250;margin:12px 0;font-variant-numeric:tabular-nums}.pomo-cat{display:flex;justify-content:center;align-items:center;margin:8px}.pomo-img{width:220px;max-width:76%;height:auto;object-fit:contain;display:block;margin:0 auto}.range-row{display:flex;gap:10px;align-items:center}.range-row input{flex:1}@media(max-width:540px){body{padding:12px;padding-bottom:92px}.stats{grid-template-columns:repeat(2,1fr)}.row{display:block}.tabs{gap:4px}.tab{font-size:12px}}

</head><body>
<header><div class="top"><div><h1>AT 學員管理</h1><div class="sub" id="todayDate"></div><div class="sub">full-stable v3</div></div><div style="text-align:right;font-size:11px"><div id="syncStatus">準備中...</div><button onclick="syncFromCloud()">🔄 同步</button></div></div></header>
<div class="stats"><div class="stat"><b id="statTotal">0</b><span>總學員</span></div><div class="stat"><b id="statBooked">0</b><span>已約課</span></div><div class="stat"><b id="statDone">0</b><span>體驗完成</span></div><div class="stat"><b id="statConverted">0</b><span>已轉正</span></div></div>
<div class="tabs"><div class="tab active" data-view="list">名單</div><div class="tab" data-view="templates">範本</div><div class="tab" data-view="pomodoro">專注</div><div class="tab" data-view="settings">設定</div></div>
<section id="listView"><input id="searchBox" class="search" placeholder="搜尋姓名、UID、手機、LINE"><div class="filters" id="filters"></div><div id="studentList"></div></section>
<section id="templatesView" style="display:none"><div class="section-title">訊息範本</div><div class="hint">點擊範本可複製。可匯入你之前下載的 at_templates JSON。</div><div id="templateList"></div><div class="actions"><button class="btn btn-primary" onclick="exportTemplates()">匯出範本 JSON</button><button class="btn btn-second" onclick="document.getElementById('templateImportFile').click()">匯入範本 JSON</button><button class="btn btn-del" onclick="resetTemplates()">恢復預設範本</button><input id="templateImportFile" type="file" accept=".json" style="display:none" onchange="importTemplates(event)"></div><div class="section-title">資料管理</div><div class="actions"><button class="btn btn-second" onclick="exportData()">匯出資料 JSON</button><button class="btn btn-second" onclick="document.getElementById('importFile').click()">匯入資料</button><input id="importFile" type="file" accept=".json" style="display:none" onchange="importData(event)"></div></section>
<section id="pomodoroView" style="display:none"><div class="card"><div class="section-title" style="margin-top:0">專注番茄鐘</div><div class="row"><div class="form-group"><label>工作分鐘</label><input id="pomoWork" type="number" min="1" max="120" value="25"></div><div class="form-group"><label>休息分鐘</label><input id="pomoRest" type="number" min="1" max="60" value="5"></div></div></div><div class="pomo"><div id="pomoMode">準備工作</div><div class="pomo-cat"><img id="pomoImg" class="pomo-img" alt="pomodoro cat"></div><div class="pomo-time" id="pomoTime">25:00</div><div class="actions" style="justify-content:center"><button class="btn pomo-primary" onclick="pomoStartPause()" id="pomoStartBtn">開始</button><button class="btn btn-second" onclick="pomoReset()">重設</button></div><div class="small">完成輪數：<span id="pomoRounds">0</span></div></div></section>
<section id="settingsView" style="display:none"><div class="card"><div class="section-title" style="margin-top:0">同步設定</div><div class="hint">Apps Script URL 只貼到 /exec。Token 要和 Code.gs 的 APP_TOKEN 完全相同。</div><div class="form-group"><label>顧問名稱</label><input id="setConsultantName" type="text" placeholder="例如：Helga"></div><div class="form-group"><label>Apps Script URL / 同步網址</label><input id="setSyncUrl" type="text" placeholder="https://script.google.com/macros/s/.../exec"></div><div class="form-group"><label>同步金鑰 / Token</label><input id="setSyncToken" type="password" placeholder="請填入同步金鑰"></div><div class="form-group"><label>預設簽名</label><input id="setSignature" type="text" placeholder="可留空"></div><div class="row"><div class="form-group"><label>品牌色</label><input id="setBrandColor" type="color" value="#424A5A"></div><div class="form-group"><label>字體大小</label><div class="range-row"><input id="setFontSize" type="range" min="14" max="22" value="16" oninput="previewFont(this.value)"><span id="fontSizeLabel">16px</span></div></div></div><div class="actions"><button class="btn btn-primary" onclick="saveSettings()">儲存設定</button><button class="btn btn-second" onclick="testSyncUrl()">測試同步</button><button class="btn btn-second" onclick="clearSyncFlags()">清同步旗標</button></div></div></section>
<div class="fab"><button onclick="openModal()">＋ 新增學員</button></div>
<div class="modal" id="editModal"><div class="modal-box"><span class="close" onclick="closeModal()">×</span><div class="modal-title" id="modalTitle">新增學員</div><div class="form-group"><label>姓名 *</label><input id="fName" type="text"></div><div class="row"><div class="form-group"><label>UID</label><input id="fUid" type="text"></div><div class="form-group"><label>手機</label><input id="fPhone" type="tel"></div></div><div class="row"><div class="form-group"><label>登入方式</label><select id="fLogin"><option value="">--</option><option value="信箱/手機">信箱/手機</option><option>Apple</option><option>Google</option><option>Facebook</option><option>Line</option></select></div><div class="form-group"><label>LINE ID</label><input id="fLine" type="text"></div></div><div class="form-group"><label>需求備註</label><textarea id="fNeed" placeholder="學習需求、預算、時段偏好等"></textarea></div><div class="form-group"><label>老師姓名（選填）</label><input id="fTeacherName" type="text" placeholder="可留空，例如：芷安"></div><div class="form-group"><label>老師連結（選填）</label><input id="fTeacher" type="text" placeholder="可留空，或貼上老師頁面連結"></div><div class="row"><div class="form-group"><label>體驗課時間</label><input id="fClassTime" type="datetime-local"></div><div class="form-group"><label>狀態</label><select id="fStatus"><option value="new">新名單</option><option value="contacted">待聯繫</option><option value="booked">已約課</option><option value="done">體驗完成</option><option value="log">已 log</option><option value="converted">體轉正</option><option value="lost">流失</option></select></div></div><div class="form-group"><label>指定聯絡時間</label><input id="fContactTime" type="datetime-local"></div><div class="actions"><button class="btn btn-primary" onclick="saveStudent()" style="flex:1">儲存</button><button class="btn btn-second" onclick="closeModal()">取消</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
const STORAGE_KEY='at_students_v1',SETTINGS_KEY='at_manager_settings_v1',TEMPLATE_KEY='at_templates_v1',NEEDS_PUSH_KEY='at_manager_needs_push_v2',DIRTY_IDS_KEY='at_manager_dirty_student_ids_v1',DELETED_IDS_KEY='at_manager_deleted_student_ids_v1';
let students=[],currentFilter='all',currentView='list',editingId=null;
const STATUSES=[['all','全部'],['new','新名單'],['contacted','待聯繫'],['booked','已約課'],['done','體驗完成'],['log','已 log'],['converted','體轉正'],['lost','流失']];
const DEFAULT_SETTINGS={consultantName:'Helga',syncUrl:'',syncToken:'',signature:'Helga',brandColor:'#424A5A',fontSize:16};let settings=loadSettings();
const DEFAULT_TEMPLATES=[{"label":"課前預約確認","text":"哈囉，有幫您安排 [老師姓名] 老師 [上課時間] 的體驗課程，請問這時間可以嗎？\n\n老師的頁面：\n[老師連結]\n\n建議您可以先私訊老師，跟老師說一下學習需求，如有需要調整課程時間，請於上課前 12 小時調整唷～\n\n私訊老師跟第一次進教室教學：\nhttps://amazingtalker.elevio.help/zh-hant/articles/244\n\n流程說明：\n1. 登入官網或 APP\n2. 首頁（A、逛逛）會看到預約好的課程\n3. 點進去課程明細\n4. 找到老師的頁面點選「聯繫老師」，或者會有私訊的按鈕\n5. 完成課前問卷及傳個訊息給老師\n\nHelga"},{"label":"課前 24 小時完整提醒（含優惠）","text":"📢 小提醒～我們 [上課時間] 有一堂體驗課！\n\n教室會在課程開始前 10 分鐘開放，登入方式請選擇 [登入方式] 登入唷～\n登入 AmazingTalker 後到首頁，找到待會要上的課程，點擊「進入教室」就可以上課囉！有空可以提早上去熟悉一下畫面唷～\n\n課後再麻煩幫我留個 10 分鐘，我會打電話關心一下上課的狀況。\n\n另外～老師會在課後送您一張「體驗課後 24 小時內完成購課」的折價券，可以直接在老師的對話框領取，搭配堂數折扣買課最划算！課後可以跟老師討論一下唷～\n\n💎 堂數折扣：\n• 單次購買 20 堂課或 20 堂的倍數：85 折（最優惠）\n• 單次購買 10 堂：9 折\n• 單次購買 5 堂：95 折\n\n如有需要調整請提早到系統內調整，確認上線沒問題也再麻煩留個貼圖給我唷～😉💖\n\nHelga"},{"label":"設備準備說明","text":"上課設備準備：\n\n💻 筆電：\n直接使用 Google 瀏覽器，登入平台後會看到預約的課程教室。建議先下載桌面版 AT 教室。\n\n📱 平板或手機：\n請下載「Amazingtalker」App 與「Zoom」App，預約好的課程在 Amazingtalker App 中可以看到。\n\n有任何問題隨時跟我說～\nHelga"},{"label":"調整課程時間說明","text":"如需要調整課程時間，可以參考這個教學：\nhttps://amazingtalker.elevio.help/zh-hant/articles/338\n\n流程說明：\n1. 登入官網或 APP，首頁（A、逛逛）會看到預約好的課程\n2. 點進去課程明細，取消時間\n3. 到老師頁面安排新的時段，或請顧問協助安排\n\n有需要協助再跟我說～\nHelga"},{"label":"課前 30 分鐘自我提醒","text":"⚠️ [姓名] 30 分鐘後上課\n注意 LINE 訊息！"},{"label":"課後 30 分鐘關懷","text":"哈囉 [姓名]～剛剛體驗課順利嗎？\n還習慣老師的教學方式嗎？\n如果有任何想法都可以跟我說～\nHelga"},{"label":"課後 24 小時跟進","text":"哈囉 [姓名]，我是 Helga～\n關於昨天的體驗課，不知道你後續的學習計畫如何呢？\n如果有想要正式開始上課，這邊可以協助你規劃適合的課程組合，也有一些優惠方案可以介紹給你 :)\n方便的話我們約個時間聊聊？"},{"label":"優惠促轉訊息","text":"哈囉 [姓名]～\n想跟你分享一個訊息：本週有限時優惠方案，如果有打算開始正式上課，現在報名很划算！\n要不要我幫你算一下你想學的課程組合？\nHelga"},{"label":"課後 22 小時優惠券到期提醒","text":"哈囉，提醒一下，我們的優惠券在 [優惠到期時間] 就要到期囉，確定要買課的話建議提早一小時完成購課，有問題都可以再跟我說唷~😊"},{"label":"一週後關懷","text":"哈囉 [姓名]，最近好嗎？\n上週的體驗課之後，有持續學習的想法嗎？\n不論是想換老師、調整方向、或是有任何疑問，都可以跟我說～\nHelga"},{"label":"正式課程注意事項","text":"【正式課程注意事項】\n\n🐰課程安排\n購課後可依老師行事曆自由預約，建議提早預約避免額滿。\n想和老師溝通或傳檔案，可以在上課之前善用平台內訊息功能。\n步驟：首頁(A) > 預約課程 > 點選老師課程包\n\n🧸請假與取消\n📌 需請假請於課程開始的 12 小時之前取消。\n📘 教學：https://amazingtalker.elevio.help/zh-hant/articles/338\n\n📌 若是特殊狀況在 12 小時內，請務必與老師溝通唷！\n📘 教學：https://amazingtalker.elevio.help/zh-hant/articles/355\n\n🎬 課程影片開放下載\n步驟：首頁(A) > 行事曆 > 點選上課日期 > 打開課程明細 > 下載錄影檔\n教學：https://amazingtalker.elevio.help/zh-hant/articles/663\n\n🎧 客戶支援\n遇到設備或老師問題，隨時可聯繫線上客服✨\n💻 網頁版：右上方「❓」> 聯繫我們\n📞 APP版：右下方帳號 > 客戶支持 > 右上方💬圖示\n\n⏳ 課程時效\n課程包的使用期限取決於您在單次交易中購買的課堂數量。\n詳細說明：https://amazingtalker.elevio.help/zh-hant/articles/111\n✅ 在期限內完成學習並續課，可以讓您的學習發揮最大效益唷～\n📌 特殊情況需要協助延長請告知我唷！\n\n🎁 學伴計畫\n加入學伴計畫，立領 20 美元優惠券＋完課獎金！為自己賺獎學金\n1️⃣ 向朋友或社群索取邀請碼\n2️⃣ 綁定後立即領券＋累積獎金\n活動頁面：https://tw.amazingtalker.com/member-get-member\n\n🙌 想邀請親友一起學習，可提供手機號碼給我協助，或在顧問官方 LINE 留言【找Helga】，會速速提供課程諮詢及體驗課申請的服務喔"},{"label":"課後購課方式","text":"這邊給您參考一下，購課及優惠券使用說明～\n\n購買堂數後可以開始預約要上課的日期，老師有送您一張 24 小時內購課折價優惠唷。\n\n📌 結帳流程\n點選自己的頭像到「帳戶」 → 「優惠券」 → 領優惠券 → 到老師頁面選擇想要的堂數 → 選擇結帳方式 → 完成結帳後就可以預約課程囉。"}];

function $(id){return document.getElementById(id)}function showToast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}function uid(){return 's_'+Date.now()+'_'+Math.random().toString(36).slice(2,7)}function loadSettings(){try{return {...DEFAULT_SETTINGS,...JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}')}}catch(e){return {...DEFAULT_SETTINGS}}}function saveSettings(){settings={consultantName:$('setConsultantName').value.trim()||'顧問',syncUrl:$('setSyncUrl').value.trim(),syncToken:$('setSyncToken').value.trim(),signature:$('setSignature').value.trim(),brandColor:$('setBrandColor').value||'#424A5A',fontSize:Number($('setFontSize').value)||16};localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));applySettings();populateSettings();showToast('設定已儲存')}function populateSettings(){$('setConsultantName').value=settings.consultantName||'';$('setSyncUrl').value=settings.syncUrl||'';$('setSyncToken').value=settings.syncToken||'';$('setSignature').value=settings.signature||'';$('setBrandColor').value=settings.brandColor||'#424A5A';$('setFontSize').value=settings.fontSize||16;$('fontSizeLabel').textContent=(settings.fontSize||16)+'px'}function hexToRgb(h){h=String(h||'#424A5A').replace('#','');const n=parseInt(h,16);return Number.isNaN(n)?'66,74,90':`${(n>>16)&255},${(n>>8)&255},${n&255}`}function applySettings(){document.documentElement.style.setProperty('--brand',settings.brandColor||'#424A5A');document.documentElement.style.setProperty('--brand-rgb',hexToRgb(settings.brandColor));document.documentElement.style.setProperty('--font',(settings.fontSize||16)+'px');const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=settings.brandColor||'#424A5A'}function previewFont(v){$('fontSizeLabel').textContent=v+'px';document.documentElement.style.setProperty('--font',v+'px')}function getSyncUrl(){return(settings.syncUrl||'').trim()}function getToken(){return(settings.syncToken||'').trim()}function sep(url){return url.includes('?')?'&':'?'}function updateSyncStatus(m){$('syncStatus').textContent=m}function normalizePhone(v){const raw=String(v||'').trim(),c=raw.replace(/[\s\-()]/g,'');return /^9\d{8}$/.test(c)?'0'+c:raw}function normalizeStudent(s){return{id:String(s.id||''),name:String(s.name||''),uid:String(s.uid||''),phone:normalizePhone(s.phone||''),loginType:String(s.loginType||''),lineId:String(s.lineId||''),need:String(s.need||''),teacherName:String(s.teacherName||''),teacherUrl:String(s.teacherUrl||''),classTime:String(s.classTime||''),contactTime:String(s.contactTime||''),status:String(s.status||'new'),createdAt:String(s.createdAt||''),updatedAt:String(s.updatedAt||'')}}function saveLocal(){localStorage.setItem(STORAGE_KEY,JSON.stringify(students.map(normalizeStudent)))}function loadLocal(){try{students=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]').map(normalizeStudent)}catch(e){students=[]}}function markNeedsPush(){localStorage.setItem(NEEDS_PUSH_KEY,'1')}function clearNeedsPush(){localStorage.removeItem(NEEDS_PUSH_KEY);localStorage.removeItem(DIRTY_IDS_KEY);localStorage.removeItem(DELETED_IDS_KEY)}function hasNeedsPush(){return localStorage.getItem(NEEDS_PUSH_KEY)==='1'}function clearSyncFlags(){clearNeedsPush();showToast('已清除同步旗標');syncFromCloud()}
async function testSyncUrl(){const url=$('setSyncUrl').value.trim(),token=$('setSyncToken').value.trim();if(!url)return alert('請先貼上 Apps Script URL');try{const r=await fetch(url+sep(url)+'action=diagnose&token='+encodeURIComponent(token)+'&ts='+Date.now());const d=await r.json();alert(d.ok?'同步測試成功，讀到 '+(d.studentCount??(d.students?d.students.length:'?'))+' 筆資料':'測試失敗：'+(d.error||'未知錯誤'))}catch(e){alert('同步測試失敗：'+e.message)}}async function syncFromCloud(){const url=getSyncUrl();if(!url){updateSyncStatus('未設定同步');return}updateSyncStatus('同步中...');try{if(hasNeedsPush()&&students.length>0)await pushToCloud(false);const r=await fetch(url+sep(url)+'action=list&ts='+Date.now()+'&token='+encodeURIComponent(getToken()));const d=await r.json();if(!d.students)throw new Error(d.error||'回傳格式不含 students');students=d.students.map(normalizeStudent);saveLocal();clearNeedsPush();updateSyncStatus('已同步 '+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}));render()}catch(e){console.error(e);updateSyncStatus('同步失敗，使用本機資料');render()}}async function pushToCloud(show=true){const url=getSyncUrl();if(!url){updateSyncStatus('未設定同步');return}if(students.length===0){showToast('沒有資料，不送出空白覆蓋');return}updateSyncStatus('儲存中...');try{await fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'save',token:getToken(),students:students.map(normalizeStudent)})});clearNeedsPush();updateSyncStatus('已送出儲存 '+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}));if(show)showToast('已送出儲存')}catch(e){console.error(e);updateSyncStatus('儲存失敗，本機已保存')}}
function render(){renderStats();renderFilters();if(currentView==='list')renderList();if(currentView==='templates')renderTemplates();pomoRender()}function renderStats(){$('statTotal').textContent=students.length;$('statBooked').textContent=students.filter(s=>s.status==='booked').length;$('statDone').textContent=students.filter(s=>s.status==='done'||s.status==='log').length;$('statConverted').textContent=students.filter(s=>s.status==='converted').length}function statusName(s){return{new:'新名單',contacted:'待聯繫',booked:'已約課',done:'體驗完成',log:'已 log',converted:'體轉正',lost:'流失'}[s]||s}function renderFilters(){const box=$('filters');box.innerHTML=STATUSES.map(([v,l])=>`<div class="chip ${currentFilter===v?'active':''}" onclick="currentFilter='${v}';renderList();renderFilters()">${l}</div>`).join('')}function fmt(dt){if(!dt)return'';const d=new Date(dt);if(isNaN(d))return dt;const w='日一二三四五六'[d.getDay()];return`${d.getMonth()+1}/${d.getDate()}（${w}）${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}function esc(v){return String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function escAttr(v){return esc(v).replace(/`/g,'')}function renderList(){const q=$('searchBox').value.trim().toLowerCase();let list=students.filter(s=>(currentFilter==='all'||s.status===currentFilter)&&(!q||[s.name,s.uid,s.phone,s.lineId,s.teacherName].some(x=>String(x||'').toLowerCase().includes(q))));list.sort((a,b)=>String(b.classTime||b.createdAt).localeCompare(String(a.classTime||a.createdAt)));$('studentList').innerHTML=list.length?list.map(s=>`<div class="card"><div class="card-head"><div><div class="name">${esc(s.name)}</div>${s.uid?`<div class="small">UID: ${esc(s.uid)}</div>`:''}</div><div class="status s-${s.status}">${statusName(s.status)}</div></div><div class="small">${s.phone?'📱 '+esc(s.phone)+' ':''}${s.lineId?' LINE '+esc(s.lineId)+' ':''}${s.loginType?' 登入 '+esc(s.loginType):''}</div>${s.teacherName||s.teacherUrl?`<div class="small">老師：${esc(s.teacherName||'')}${s.teacherUrl?'｜已填老師連結':''}</div>`:''}${s.need?`<div class="note">📝 ${esc(s.need)}</div>`:''}${s.classTime?`<div class="small">⏰ 體驗課：${fmt(s.classTime)}</div>`:''}${s.contactTime?`<div class="small">📌 指定聯絡：${fmt(s.contactTime)}</div>`:''}<div class="actions">${s.phone?`<button class="btn btn-call" onclick="location.href='tel:${s.phone.replace(/[^0-9+]/g,'')}'">撥號</button>`:''}<button class="btn btn-cal" onclick="addToCalendar('${s.id}')">加日曆</button><button class="btn btn-line" onclick="copyForStudent('${s.id}')">複製訊息</button>${s.teacherUrl?`<button class="btn btn-second" onclick="window.open('${escAttr(s.teacherUrl)}','_blank')">老師頁</button>`:''}<button class="btn btn-second" onclick="openModal('${s.id}')">編輯</button><button class="btn btn-del" onclick="deleteStudent('${s.id}')">刪除</button></div></div>`).join(''):'<div class="empty">沒有符合的學員</div>'}
function openModal(id){editingId=id||null;$('modalTitle').textContent=id?'編輯學員':'新增學員';const s=id?students.find(x=>x.id===id):{};['Name','Uid','Phone','Line','Need','TeacherName','Teacher','ClassTime','ContactTime'].forEach(k=>{$('f'+k).value=''});$('fStatus').value='new';$('fLogin').value='';if(s){$('fName').value=s.name||'';$('fUid').value=s.uid||'';$('fPhone').value=s.phone||'';$('fLogin').value=s.loginType||'';$('fLine').value=s.lineId||'';$('fNeed').value=s.need||'';$('fTeacherName').value=s.teacherName||'';$('fTeacher').value=s.teacherUrl||'';$('fClassTime').value=s.classTime||'';$('fContactTime').value=s.contactTime||'';$('fStatus').value=s.status||'new'}$('editModal').classList.add('show')}function closeModal(){$('editModal').classList.remove('show');editingId=null}function saveStudent(){const name=$('fName').value.trim();if(!name)return alert('請輸入姓名');const now=new Date().toISOString();const data={name,uid:$('fUid').value.trim(),phone:normalizePhone($('fPhone').value.trim()),loginType:$('fLogin').value.trim(),lineId:$('fLine').value.trim(),need:$('fNeed').value.trim(),teacherName:$('fTeacherName').value.trim(),teacherUrl:$('fTeacher').value.trim(),classTime:$('fClassTime').value,contactTime:$('fContactTime').value,status:$('fStatus').value,updatedAt:now};if(editingId){const i=students.findIndex(x=>x.id===editingId);if(i>=0)students[i]={...students[i],...data}}else students.push({id:uid(),createdAt:now,...data});saveLocal();markNeedsPush();closeModal();render();pushToCloud();showToast('已儲存')}function deleteStudent(id){const s=students.find(x=>x.id===id);if(!s)return;if(!confirm('確定刪除 '+s.name+'？'))return;students=students.filter(x=>x.id!==id);saveLocal();markNeedsPush();render();pushToCloud();showToast('已刪除')}
function addToCalendar(id){const s=students.find(x=>x.id===id);if(!s||(!s.classTime&&!s.contactTime))return showToast('請先設定體驗課或指定聯絡時間');const syncUrl=getSyncUrl();if(!syncUrl)return downloadCalendarICS(s);const params=new URLSearchParams({action:'addCalendarEventsSimple',name:s.name||'',classTime:s.classTime||'',phone:normalizePhone(s.phone)||'',lineId:s.lineId||'',teacherName:s.teacherName||'',contactTime:s.contactTime||'',token:getToken(),ts:String(Date.now())});const url=syncUrl+sep(syncUrl)+params.toString();fetch(url,{method:'GET',mode:'no-cors',cache:'no-store'}).catch(()=>{});showToast('已送出日曆建立請求');setTimeout(()=>{if(confirm('要開啟結果頁確認是否建立成功嗎？'))window.open(url,'_blank')},900)}function buildCalendarEvents(s){const events=[];const add=(title,base,off,dur)=>{const b=new Date(base);if(isNaN(b))return;const st=new Date(b.getTime()+off*60000),en=new Date(st.getTime()+dur*60000);events.push({title,start:st,end:en,desc:`AT 學員提醒\n學員：${s.name}\n手機：${s.phone||''}\nLINE：${s.lineId||''}`})};if(s.classTime){add(`[課前一天] 提醒 ${s.name} 上課`,s.classTime,-1440,15);add(`[課前30分] ${s.name} 即將上課`,s.classTime,-30,10);add(`[課後30分] 關懷 ${s.name}`,s.classTime,30,15);add(`[AT優惠券到期提醒] ${s.name}`,s.classTime,22*60,15);add(`[AT 24H Log] 跟進 ${s.name}`,s.classTime,23*60,30)}if(s.contactTime)add(`[AT指定聯絡] ${s.name}`,s.contactTime,0,15);return events}function downloadCalendarICS(s){const pad=n=>String(n).padStart(2,'0'),icsDate=d=>d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+pad(d.getUTCHours())+pad(d.getUTCMinutes())+pad(d.getUTCSeconds())+'Z',escI=v=>String(v||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');const ve=buildCalendarEvents(s).map((e,i)=>['BEGIN:VEVENT',`UID:${s.id}-${i}@at-manager`,`DTSTAMP:${icsDate(new Date())}`,`DTSTART:${icsDate(e.start)}`,`DTEND:${icsDate(e.end)}`,`SUMMARY:${escI(e.title)}`,`DESCRIPTION:${escI(e.desc)}`,'END:VEVENT'].join('\r\n')).join('\r\n');const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//AT M
