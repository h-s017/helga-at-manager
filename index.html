<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#424A5A">
<title>AT 學員管理 | Hana</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;background:#F4F1EB;color:#2C2C2C;padding:16px;padding-bottom:96px;max-width:760px;margin:0 auto;font-size:16px}header{background:#424A5A;color:white;padding:18px 20px;border-radius:12px;margin-bottom:14px}h1{font-size:18px;font-weight:650}.sub{font-size:12px;opacity:.72;margin-top:4px}.topbar{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.top-actions{text-align:right;font-size:11px}.top-actions button{margin-top:6px;background:rgba(255,255,255,.16);color:white;border:0;border-radius:6px;padding:6px 9px;font-size:11px}.tabs{display:flex;gap:6px;margin-bottom:14px;background:white;padding:4px;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.04)}.tab{flex:1;text-align:center;padding:10px 4px;border-radius:7px;font-size:13px;cursor:pointer}.tab.active{background:#424A5A;color:white}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}.stat{background:white;border-radius:8px;text-align:center;padding:10px 4px}.stat b{display:block;color:#424A5A;font-size:20px}.stat span{font-size:10px;color:#777}.card{background:white;border-radius:10px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.05)}.card-head{display:flex;justify-content:space-between;gap:10px}.name{font-weight:650;font-size:15px}.small{font-size:12px;color:#777;line-height:1.7;margin-top:4px}.note{font-size:12px;color:#555;background:#F8F6F1;padding:7px 8px;border-radius:7px;margin-top:8px}.status{font-size:11px;border-radius:12px;padding:3px 9px;white-space:nowrap;background:#E8F4F8;color:#2A6F86}.s-booked{background:#DFEEDA;color:#2C5F1F}.s-done{background:#E8E2F5;color:#5A3F8C}.s-log{background:#FAE0D5;color:#B0421A}.s-converted{background:#D4F0DD;color:#1B6B36}.s-lost{background:#eee;color:#777}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.btn{border:0;border-radius:7px;padding:8px 11px;font-size:12px;cursor:pointer;font-family:inherit}.btn-primary{background:#424A5A;color:white}.btn-second{background:#EAE4D8;color:#555}.btn-call{background:#FF6B35;color:white}.btn-line{background:#06C755;color:white}.btn-cal{background:#4A86E8;color:white}.btn-del{background:transparent;color:#C44}.search{width:100%;padding:10px 13px;border:1px solid #DDD6C5;border-radius:8px;font-size:14px;margin-bottom:10px;background:white}.filters{display:flex;gap:6px;overflow:auto;margin-bottom:10px}.chip{background:white;border:1px solid #E5DDC8;border-radius:18px;padding:6px 11px;font-size:12px;white-space:nowrap;cursor:pointer}.chip.active{background:#424A5A;color:white}.empty{text-align:center;color:#999;padding:44px 10px;font-size:13px}.fab{position:fixed;left:16px;right:16px;bottom:22px;max-width:728px;margin:0 auto;pointer-events:none}.fab button{pointer-events:auto;width:100%;padding:15px;border:0;border-radius:12px;background:#424A5A;color:white;font-weight:650;font-size:15px;box-shadow:0 4px 16px rgba(66,74,90,.28)}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:50;overflow:auto;padding:20px 12px}.modal.show{display:block}.modal-box{background:white;border-radius:14px;padding:18px;max-width:620px;margin:0 auto}.modal-title{font-weight:650;color:#424A5A;margin-bottom:12px}.close{float:right;font-size:22px;color:#888;cursor:pointer}.form-group{margin-bottom:11px}.form-group label{display:block;font-size:12px;color:#555;margin-bottom:4px;font-weight:550}.form-group input,.form-group select,.form-group textarea{width:100%;padding:9px 10px;border:1px solid #DDD6C5;border-radius:7px;font-size:14px;font-family:inherit;background:white}.form-group textarea{min-height:64px;resize:vertical}.row{display:flex;gap:8px}.row .form-group{flex:1}.section-title{font-size:14px;font-weight:650;color:#424A5A;margin:12px 0 8px}.hint{font-size:12px;color:#888;line-height:1.6;margin:4px 0 10px}.toast{position:fixed;left:50%;bottom:102px;transform:translateX(-50%);background:#424A5A;color:white;padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;transition:.25s;z-index:99}.toast.show{opacity:1}.template{white-space:pre-wrap;background:white;border:1px solid #E5DDC8;border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.55;margin-bottom:8px;cursor:pointer}@media(max-width:540px){body{padding:12px;padding-bottom:92px}.stats{grid-template-columns:repeat(2,1fr)}.row{display:block}.tabs{gap:4px}.tab{font-size:12px}}
</style>
</head>
<body>
<header><div class="topbar"><div><h1>AT 學員管理</h1><div class="sub" id="todayDate"></div><div class="sub">stable-sync v2</div></div><div class="top-actions"><div id="syncStatus">準備中...</div><button onclick="syncFromCloud()">🔄 同步</button></div></div></header>
<div class="stats"><div class="stat"><b id="statTotal">0</b><span>總學員</span></div><div class="stat"><b id="statBooked">0</b><span>已約課</span></div><div class="stat"><b id="statDone">0</b><span>體驗完成</span></div><div class="stat"><b id="statConverted">0</b><span>已轉正</span></div></div>
<div class="tabs"><div class="tab active" data-view="list">名單</div><div class="tab" data-view="templates">範本</div><div class="tab" data-view="settings">設定</div></div>
<section id="listView"><input id="searchBox" class="search" placeholder="搜尋姓名、UID、手機、LINE"><div class="filters" id="filters"></div><div id="studentList"></div></section>
<section id="templatesView" style="display:none"><div class="section-title">訊息範本</div><div id="templateList"></div><div class="section-title">資料管理</div><div class="actions"><button class="btn btn-second" onclick="exportData()">匯出資料 JSON</button><button class="btn btn-second" onclick="document.getElementById('importFile').click()">匯入資料</button><input id="importFile" type="file" accept=".json" style="display:none" onchange="importData(event)"></div></section>
<section id="settingsView" style="display:none"><div class="card"><div class="section-title" style="margin-top:0">同步設定</div><div class="hint">Apps Script URL 只貼到 /exec。Token 要和 Code.gs 的 APP_TOKEN 完全相同。</div><div class="form-group"><label>顧問名稱</label><input id="setConsultantName" type="text" placeholder="例如：Helga"></div><div class="form-group"><label>Apps Script URL / 同步網址</label><input id="setSyncUrl" type="text" placeholder="https://script.google.com/macros/s/.../exec"></div><div class="form-group"><label>同步金鑰 / Token</label><input id="setSyncToken" type="password" placeholder="請填入同步金鑰"></div><div class="form-group"><label>預設簽名</label><input id="setSignature" type="text" placeholder="可留空"></div><div class="actions"><button class="btn btn-primary" onclick="saveSettings()">儲存設定</button><button class="btn btn-second" onclick="testSyncUrl()">測試同步</button><button class="btn btn-second" onclick="clearSyncFlags()">清同步旗標</button></div></div></section>
<div class="fab"><button onclick="openModal()">＋ 新增學員</button></div>
<div class="modal" id="editModal"><div class="modal-box"><span class="close" onclick="closeModal()">×</span><div class="modal-title" id="modalTitle">新增學員</div><div class="form-group"><label>姓名 *</label><input id="fName" type="text"></div><div class="row"><div class="form-group"><label>UID</label><input id="fUid" type="text"></div><div class="form-group"><label>手機</label><input id="fPhone" type="tel"></div></div><div class="row"><div class="form-group"><label>登入方式</label><select id="fLogin"><option value="">--</option><option value="信箱/手機">信箱/手機</option><option>Apple</option><option>Google</option><option>Facebook</option><option>Line</option></select></div><div class="form-group"><label>LINE ID</label><input id="fLine" type="text"></div></div><div class="form-group"><label>需求備註</label><textarea id="fNeed" placeholder="學習需求、預算、時段偏好等"></textarea></div><div class="form-group"><label>老師姓名（選填）</label><input id="fTeacherName" type="text" placeholder="可留空，例如：芷安"></div><div class="form-group"><label>老師連結（選填）</label><input id="fTeacher" type="text" placeholder="可留空，或貼上老師頁面連結"></div><div class="row"><div class="form-group"><label>體驗課時間</label><input id="fClassTime" type="datetime-local"></div><div class="form-group"><label>狀態</label><select id="fStatus"><option value="new">新名單</option><option value="contacted">待聯繫</option><option value="booked">已約課</option><option value="done">體驗完成</option><option value="log">已 log</option><option value="converted">體轉正</option><option value="lost">流失</option></select></div></div><div class="form-group"><label>指定聯絡時間</label><input id="fContactTime" type="datetime-local"></div><div class="actions"><button class="btn btn-primary" onclick="saveStudent()" style="flex:1">儲存</button><button class="btn btn-second" onclick="closeModal()">取消</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
const STORAGE_KEY='at_students_v1';
const SETTINGS_KEY='at_manager_settings_v1';
const NEEDS_PUSH_KEY='at_manager_needs_push_v2';
const DIRTY_IDS_KEY='at_manager_dirty_student_ids_v1';
const DELETED_IDS_KEY='at_manager_deleted_student_ids_v1';
let students=[];let currentFilter='all';let currentView='list';let editingId=null;
const STATUSES=[['all','全部'],['new','新名單'],['contacted','待聯繫'],['booked','已約課'],['done','體驗完成'],['log','已 log'],['converted','體轉正'],['lost','流失']];
const DEFAULT_SETTINGS={consultantName:'Helga',syncUrl:'',syncToken:'',signature:'Helga'};
let settings=loadSettings();
const TEMPLATES=[{label:'課前預約確認',text:'哈囉，有幫您安排 [老師姓名] 老師 [上課時間] 的體驗課程，請問這時間可以嗎？\n\n老師頁面：\n[老師連結]\n\n建議您可以先私訊老師，跟老師說一下學習需求。\n\n[簽名]'},{label:'課前提醒',text:'📢 小提醒～我們 [上課時間] 有一堂體驗課！\n\n請使用 [登入方式] 登入 AmazingTalker，課程開始前可先進教室確認設備。\n\n[簽名]'},{label:'課後關懷',text:'哈囉 [姓名]～剛剛體驗課順利嗎？\n還習慣老師的教學方式嗎？如果有任何想法都可以跟我說。\n\n[簽名]'},{label:'優惠券到期提醒',text:'哈囉 [姓名]～提醒一下，體驗課後 24 小時優惠券即將到期，確定要購課的話建議提早完成。'}];
function $(id){return document.getElementById(id)}
function showToast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function uid(){return 's_'+Date.now()+'_'+Math.random().toString(36).slice(2,7)}
function loadSettings(){try{return {...DEFAULT_SETTINGS,...JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}')}}catch(e){return {...DEFAULT_SETTINGS}}}
function saveSettings(){settings={consultantName:$('setConsultantName').value.trim()||'顧問',syncUrl:$('setSyncUrl').value.trim(),syncToken:$('setSyncToken').value.trim(),signature:$('setSignature').value.trim()};localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));populateSettings();showToast('設定已儲存')}
function populateSettings(){$('setConsultantName').value=settings.consultantName||'';$('setSyncUrl').value=settings.syncUrl||'';$('setSyncToken').value=settings.syncToken||'';$('setSignature').value=settings.signature||''}
function getSyncUrl(){return (settings.syncUrl||'').trim()}
function getToken(){return (settings.syncToken||'').trim()}
function sep(url){return url.includes('?')?'&':'?'}
function updateSyncStatus(msg){$('syncStatus').textContent=msg}
function normalizePhone(v){const raw=String(v||'').trim();const compact=raw.replace(/[\s\-()]/g,'');return /^9\d{8}$/.test(compact)?'0'+compact:raw}
function normalizeStudent(s){return {id:String(s.id||''),name:String(s.name||''),uid:String(s.uid||''),phone:normalizePhone(s.phone||''),loginType:String(s.loginType||''),lineId:String(s.lineId||''),need:String(s.need||''),teacherName:String(s.teacherName||''),teacherUrl:String(s.teacherUrl||''),classTime:String(s.classTime||''),contactTime:String(s.contactTime||''),status:String(s.status||'new'),createdAt:String(s.createdAt||''),updatedAt:String(s.updatedAt||'')}}
function saveLocal(){localStorage.setItem(STORAGE_KEY,JSON.stringify(students.map(normalizeStudent)))}
function loadLocal(){try{students=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]').map(normalizeStudent)}catch(e){students=[]}}
function markNeedsPush(){localStorage.setItem(NEEDS_PUSH_KEY,'1')}
function clearNeedsPush(){localStorage.removeItem(NEEDS_PUSH_KEY);localStorage.removeItem(DIRTY_IDS_KEY);localStorage.removeItem(DELETED_IDS_KEY)}
function hasNeedsPush(){return localStorage.getItem(NEEDS_PUSH_KEY)==='1'}
function clearSyncFlags(){clearNeedsPush();showToast('已清除同步旗標');syncFromCloud()}
async function testSyncUrl(){const url=$('setSyncUrl').value.trim();const token=$('setSyncToken').value.trim();if(!url)return alert('請先貼上 Apps Script URL');try{const r=await fetch(url+sep(url)+'action=diagnose&token='+encodeURIComponent(token)+'&ts='+Date.now());const d=await r.json();alert(d.ok?'同步測試成功，讀到 '+(d.studentCount??(d.students?d.students.length:'?'))+' 筆資料':'測試失敗：'+(d.error||'未知錯誤'))}catch(e){alert('同步測試失敗：'+e.message)}}
async function syncFromCloud(){const url=getSyncUrl();if(!url){updateSyncStatus('未設定同步');return}updateSyncStatus('同步中...');try{if(hasNeedsPush()&&students.length>0){await pushToCloud(false)}const r=await fetch(url+sep(url)+'action=list&ts='+Date.now()+'&token='+encodeURIComponent(getToken()));const d=await r.json();if(!d.students)throw new Error(d.error||'回傳格式不含 students');students=d.students.map(normalizeStudent);saveLocal();clearNeedsPush();updateSyncStatus('已同步 '+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}));render()}catch(e){console.error(e);updateSyncStatus('同步失敗，使用本機資料');render()}}
async function pushToCloud(show=true){const url=getSyncUrl();if(!url){updateSyncStatus('未設定同步');return}if(students.length===0){showToast('沒有資料，不送出空白覆蓋');return}updateSyncStatus('儲存中...');try{await fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'save',token:getToken(),students:students.map(normalizeStudent)})});clearNeedsPush();updateSyncStatus('已送出儲存 '+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}));if(show)showToast('已送出儲存')}catch(e){console.error(e);updateSyncStatus('儲存失敗，本機已保存')}}
function render(){renderStats();renderFilters();if(currentView==='list')renderList();if(currentView==='templates')renderTemplates();}
function renderStats(){$('statTotal').textContent=students.length;$('statBooked').textContent=students.filter(s=>s.status==='booked').length;$('statDone').textContent=students.filter(s=>s.status==='done'||s.status==='log').length;$('statConverted').textContent=students.filter(s=>s.status==='converted').length}
function statusName(s){return {new:'新名單',contacted:'待聯繫',booked:'已約課',done:'體驗完成',log:'已 log',converted:'體轉正',lost:'流失'}[s]||s}
function renderFilters(){const box=$('filters');box.innerHTML=STATUSES.map(([v,l])=>`<div class="chip ${currentFilter===v?'active':''}" onclick="currentFilter='${v}';renderList();renderFilters()">${l}</div>`).join('')}
function fmt(dt){if(!dt)return'';const d=new Date(dt);if(isNaN(d))return dt;const w='日一二三四五六'[d.getDay()];return `${d.getMonth()+1}/${d.getDate()}（${w}）${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function renderList(){const q=$('searchBox').value.trim().toLowerCase();let list=students.filter(s=>(currentFilter==='all'||s.status===currentFilter)&&(!q||[s.name,s.uid,s.phone,s.lineId,s.teacherName].some(x=>String(x||'').toLowerCase().includes(q))));list.sort((a,b)=>String(b.classTime||b.createdAt).localeCompare(String(a.classTime||a.createdAt)));$('studentList').innerHTML=list.length?list.map(s=>`<div class="card"><div class="card-head"><div><div class="name">${esc(s.name)}</div>${s.uid?`<div class="small">UID: ${esc(s.uid)}</div>`:''}</div><div class="status s-${s.status}">${statusName(s.status)}</div></div><div class="small">${s.phone?'📱 '+esc(s.phone)+' ':''}${s.lineId?' LINE '+esc(s.lineId)+' ':''}${s.loginType?' 登入 '+esc(s.loginType):''}</div>${s.teacherName||s.teacherUrl?`<div class="small">老師：${esc(s.teacherName||'')}${s.teacherUrl?'｜已填老師連結':''}</div>`:''}${s.need?`<div class="note">📝 ${esc(s.need)}</div>`:''}${s.classTime?`<div class="small">⏰ 體驗課：${fmt(s.classTime)}</div>`:''}${s.contactTime?`<div class="small">📌 指定聯絡：${fmt(s.contactTime)}</div>`:''}<div class="actions">${s.phone?`<button class="btn btn-call" onclick="location.href='tel:${s.phone.replace(/[^0-9+]/g,'')}'">撥號</button>`:''}<button class="btn btn-cal" onclick="addToCalendar('${s.id}')">加日曆</button><button class="btn btn-line" onclick="copyForStudent('${s.id}')">複製訊息</button>${s.teacherUrl?`<button class="btn btn-second" onclick="window.open('${escAttr(s.teacherUrl)}','_blank')">老師頁</button>`:''}<button class="btn btn-second" onclick="openModal('${s.id}')">編輯</button><button class="btn btn-del" onclick="deleteStudent('${s.id}')">刪除</button></div></div>`).join(''):'<div class="empty">沒有符合的學員</div>'}
function esc(v){return String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function escAttr(v){return esc(v).replace(/`/g,'')}
function openModal(id){editingId=id||null;$('modalTitle').textContent=id?'編輯學員':'新增學員';const s=id?students.find(x=>x.id===id):{};['Name','Uid','Phone','Line','Need','TeacherName','Teacher','ClassTime','ContactTime'].forEach(k=>{$('f'+k).value=''});$('fStatus').value='new';$('fLogin').value='';if(s){$('fName').value=s.name||'';$('fUid').value=s.uid||'';$('fPhone').value=s.phone||'';$('fLogin').value=s.loginType||'';$('fLine').value=s.lineId||'';$('fNeed').value=s.need||'';$('fTeacherName').value=s.teacherName||'';$('fTeacher').value=s.teacherUrl||'';$('fClassTime').value=s.classTime||'';$('fContactTime').value=s.contactTime||'';$('fStatus').value=s.status||'new'}$('editModal').classList.add('show')}
function closeModal(){$('editModal').classList.remove('show');editingId=null}
function saveStudent(){const name=$('fName').value.trim();if(!name)return alert('請輸入姓名');const now=new Date().toISOString();const data={name,uid:$('fUid').value.trim(),phone:normalizePhone($('fPhone').value.trim()),loginType:$('fLogin').value.trim(),lineId:$('fLine').value.trim(),need:$('fNeed').value.trim(),teacherName:$('fTeacherName').value.trim(),teacherUrl:$('fTeacher').value.trim(),classTime:$('fClassTime').value,contactTime:$('fContactTime').value,status:$('fStatus').value,updatedAt:now};if(editingId){const i=students.findIndex(x=>x.id===editingId);if(i>=0)students[i]={...students[i],...data}}else{students.push({id:uid(),createdAt:now,...data})}saveLocal();markNeedsPush();closeModal();render();pushToCloud();showToast('已儲存')}
function deleteStudent(id){const s=students.find(x=>x.id===id);if(!s)return;if(!confirm('確定刪除 '+s.name+'？'))return;students=students.filter(x=>x.id!==id);saveLocal();markNeedsPush();render();pushToCloud();showToast('已刪除')}
function addToCalendar(id){const s=students.find(x=>x.id===id);if(!s||(!s.classTime&&!s.contactTime))return showToast('請先設定體驗課或指定聯絡時間');const syncUrl=getSyncUrl();if(!syncUrl){return downloadCalendarICS(s)}const params=new URLSearchParams({action:'addCalendarEventsSimple',name:s.name||'',classTime:s.classTime||'',phone:normalizePhone(s.phone)||'',lineId:s.lineId||'',teacherName:s.teacherName||'',contactTime:s.contactTime||'',token:getToken(),ts:String(Date.now())});const url=syncUrl+sep(syncUrl)+params.toString();fetch(url,{method:'GET',mode:'no-cors',cache:'no-store'}).catch(()=>{});showToast('已送出日曆建立請求');setTimeout(()=>{if(confirm('要開啟結果頁確認是否建立成功嗎？'))window.open(url,'_blank')},900)}
function buildCalendarEvents(s){const events=[];const add=(title,base,off,dur)=>{const b=new Date(base);if(isNaN(b))return;const st=new Date(b.getTime()+off*60000);const en=new Date(st.getTime()+dur*60000);events.push({title,start:st,end:en,desc:`AT 學員提醒\n學員：${s.name}\n手機：${s.phone||''}\nLINE：${s.lineId||''}`})};if(s.classTime){add(`[課前一天] 提醒 ${s.name} 上課`,s.classTime,-1440,15);add(`[課前30分] ${s.name} 即將上課`,s.classTime,-30,10);add(`[課後30分] 關懷 ${s.name}`,s.classTime,30,15);add(`[AT優惠券到期提醒] ${s.name}`,s.classTime,22*60,15);add(`[AT 24H Log] 跟進 ${s.name}`,s.classTime,23*60,30)}if(s.contactTime)add(`[AT指定聯絡] ${s.name}`,s.contactTime,0,15);return events}
function downloadCalendarICS(s){const pad=n=>String(n).padStart(2,'0');const icsDate=d=>d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+pad(d.getUTCHours())+pad(d.getUTCMinutes())+pad(d.getUTCSeconds())+'Z';const escI=v=>String(v||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');const ve=buildCalendarEvents(s).map((e,i)=>['BEGIN:VEVENT',`UID:${s.id}-${i}@at-manager`,`DTSTAMP:${icsDate(new Date())}`,`DTSTART:${icsDate(e.start)}`,`DTEND:${icsDate(e.end)}`,`SUMMARY:${escI(e.title)}`,`DESCRIPTION:${escI(e.desc)}`,'END:VEVENT'].join('\r\n')).join('\r\n');const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//AT Manager//ZH-TW',ve,'END:VCALENDAR'].join('\r\n');const blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`AT_${s.name||'student'}_reminders.ics`;a.click();URL.revokeObjectURL(a.href)}
function applyTemplate(t,s){return t.replace(/\[姓名\]/g,s.name||'').replace(/\[老師姓名\]/g,s.teacherName||'').replace(/\[老師連結\]/g,s.teacherUrl||'').replace(/\[上課時間\]/g,fmt(s.classTime)||'').replace(/\[登入方式\]/g,s.loginType||'信箱/手機').replace(/\[簽名\]/g,settings.signature||'')}
function renderTemplates(){$('templateList').innerHTML=TEMPLATES.map((t,i)=>`<div class="template" onclick="copyText(applyTemplate(TEMPLATES[${i}],{}))"><b>${esc(t.label)}</b>\n${esc(t.text)}</div>`).join('')}
function copyForStudent(id){const s=students.find(x=>x.id===id);if(!s)return;const tpl=s.status==='booked'?TEMPLATES[0]:s.status==='done'?TEMPLATES[2]:TEMPLATES[3];copyText(applyTemplate(tpl.text,s))}
function copyText(text){if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>showToast('已複製')).catch(()=>fallbackCopy(text));else fallbackCopy(text)}
function fallbackCopy(text){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();showToast('已複製')}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(students,null,2)],{type:'application/json'}));a.download='at_students_'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{try{const data=JSON.parse(ev.target.result);if(!Array.isArray(data))throw new Error('格式錯誤');if(confirm('匯入 '+data.length+' 筆？會覆蓋目前本機資料。')){students=data.map(normalizeStudent);saveLocal();markNeedsPush();render();pushToCloud();showToast('已匯入')}}catch(err){alert('匯入失敗：'+err.message)}};reader.readAsText(file);e.target.value=''}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{currentView=t.dataset.view;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));$('listView').style.display=currentView==='list'?'block':'none';$('templatesView').style.display=currentView==='templates'?'block':'none';$('settingsView').style.display=currentView==='settings'?'block':'none';document.querySelector('.fab').style.display=currentView==='list'?'block':'none';render();if(currentView==='settings')populateSettings()});$('searchBox').oninput=renderList;$('todayDate').textContent=new Date().toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'});loadLocal();populateSettings();render();syncFromCloud();
</script>
</body>
</html>
